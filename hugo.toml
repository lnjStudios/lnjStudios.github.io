baseURL = 'https://lnjstudios.com/'
locale = 'en-IN'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
title = 'Links & Joints Studios'
theme = 'hugo-brewm'
enableRobotsTXT = true
enableGitInfo = true
ignoreFiles = ['\.redacted$', '\.old$', '\.bak$', '\.tmp$', '\.swp$', '\.DS_Store$']

[frontmatter]
	date = [':default']
	# no ':git': it would make every post "Updated <commit day>" (all were first committed on the same day).
	# Set `lastmod:` in a post's front matter when it's really edited; the byline then shows "Updated <date>"
	lastmod = ['lastmod', 'date']

[markup]
	[markup.tableOfContents]
		startLevel = 2
		endLevel = 3
		ordered = false
	[markup.highlight]
		codeFences = true
		lineNos = false
		noClasses = false
		tabWidth = 4
	[markup.goldmark.renderer]
		unsafe = true

[outputs]
	home = ['html', 'rss', 'json']

[services.rss]
	limit = 20

[sitemap]
	changeFreq = 'weekly'
	priority = 0.5

[taxonomies]
	category = 'categories'
	tag = 'tags'
	# maturity of a post's tool/guide: prototype, in-progress, stable (content/stage/). Shown as an animated
	# icon before the read time on cards (brewm) and in the byline; icons in custom.css
	stage = 'stage'
	# post authors: `author: [koustav]` in a post; each author's profile / résumé is content/author/<id>/_index.md
	# (`layout: resume`, `url: /<id>/`). Posts without one can still use `byline: {name, avatar}`
	author = 'author'

[params]
	description = 'Robots, open-source tools and experiments from a one-person robotics workshop.'
	copyright = '© 2025–2026 Links & Joints Studios · Koustav Betal'
	HideHugoCredit = false
	extMeta = true
	AllowAIRobots = false
	ZenMode = false
	DisableFootBar = false
	unifiedFooter = true
	coffeeStat = false

	[params.author]
		name = 'Koustav Betal'
		# default byline for posts without `byline: {name, avatar}` front matter (layouts/partials/page/timestamp.html)
		avatar = 'https://github.com/koustavbetal.png'

	[params.comments]
		disabled = true

	# brewm's only end-of-body hook; we use it for the Settings panel script, not for analytics
	[params.analytics]
		append = 'body'

	[params.favicon]
		ico = '/images/favicon.ico'
		png = '/images/favicon-32x32.png'
		apple = '/images/apple-touch-icon.png'
		webmanifest = '/images/site.webmanifest'
		appTitle = 'LnJ Studios'

	[params.logo]
		logoMark = '/images/brand/lnj-studios-ink.svg'
		logoMarkDark = '/images/brand/lnj-studios-paper.svg'
		logoType = false

	[params.feed]
		flowlines = false

	[params.home]
		disableSlide = false
		disableListing = false
		featuredListing = ['categories']

	[params.posts]
		justifying = false
		noIndent = true
		sfdefault = true
		# no colophon (URL + QR + build info) and no brewm share block: sharing is the Share button on the
		# right-hand rail (layouts/partials/rail.html)
		colophon = false
		disableHistory = false
		related = true
		share = false

	# brewm's own header search is off (it hands off to DuckDuckGo or Pagefind); the site search is our
	# pill at the bottom left (assets/js/lnj-search.js), reading the index Hugo itself renders from
	# assets/json/search-index.json
	[params.search]
		enable = false
		pagefind = false

	[params.typeface]
		webSafe = false
		roman = 'crimson'
		sans = 'inter'
		localHost = true
		minimalUI = false

	[params.socialCard]
		enable = true
		# absolute: LinkedIn / X / WhatsApp can't fetch a relative og:image (brewm prints this as is)
		images = 'https://lnjstudios.com/images/brand/social-card.png'
		imagesAlt = 'Links & Joints Studios: robots, open-source tools and experiments from a one-person robotics workshop'
		twitter = true
		twitterCreator = 'koustavbetal' # brewm adds the @
		opengraph = true

	# Workshop orange (same family as ROS-Manager's palette)
	[params.style]
		[params.style.light]
			ac = '#b34700'
			bg = '#f4f1ec'
			fg = '#1b1b1b'
			mid = '#6b6560'
		[params.style.dark]
			ac = '#ff8a1f'
			bg = '#111111'
			fg = '#f0f0f0'
			mid = '#9a948e'

[languages]
	[languages.en]
		label = 'English'
		locale = 'en-IN'
		direction = 'ltr'
		weight = 1
		[languages.en.pagination]
			pagerSize = 8
			path = 'page'

[menus]
	# No header (Tools/Notes live in the home categories; About and RSS are in the Settings panel)

	[[menus.footer]]
		identifier = 'youtube'
		name = 'YouTube'
		url = 'https://youtube.com/@linksnjoints'
		pre = 'youtube'
		weight = 1
	[[menus.footer]]
		identifier = 'github'
		name = 'GitHub'
		url = 'https://github.com/koustavbetal'
		pre = 'github'
		weight = 2
	[[menus.footer]]
		identifier = 'linkedin'
		name = 'LinkedIn'
		url = 'https://linkedin.com/in/koustavbetal'
		pre = 'linkedin'
		weight = 3
	[[menus.footer]]
		identifier = 'x'
		name = 'X'
		url = 'https://x.com/koustavbetal'
		pre = 'x'
		weight = 4
	[[menus.footer]]
		identifier = 'instagram'
		name = 'Instagram'
		url = 'https://instagram.com/koustavbetal'
		pre = 'instagram'
		weight = 5
